# Render Blueprint for the SENTINEL AI backend (FastAPI + WebSockets), free plan.
# Dashboard -> New -> Blueprint -> pick this repo. The frontend (repo root) deploys separately on Vercel.
services:
  - type: web
    name: sentinel-ai-backend
    runtime: python
    plan: free
    rootDir: backend-hackathon-master/backend-hackathon-master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "false"
      # Comma-separated origins allowed to call the API; set to your Vercel URL to lock it down
      - key: CORS_ORIGINS
        value: "*"
      # Gemini key for failure diagnosis + copilot chat (leave empty for rule-based fallbacks)
      - key: GOOGLE_API_KEY
        sync: false
      # Optional: Grok (xAI) sensor simulation, Gmail + Twilio alert notifications
      - key: XAI_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_TO
        sync: false
